<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Executor APK Client-Side</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    body {
      background-color: #0f172a;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .upload-section {
      margin-bottom: 15px;
    }

    input[type="file"] {
      background-color: #1e293b;
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      cursor: pointer;
    }

    #phone-container {
      width: 360px;
      height: 640px;
      background-color: #808080;
      border: 4px solid #334155;
      border-radius: 24px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    #screen-canvas {
      width: 100%;
      height: 100%;
    }

    #terminal {
      margin-top: 15px;
      font-family: monospace;
      color: #38bdf8;
      background: #1e293b;
      padding: 10px;
      border-radius: 6px;
      width: 340px;
      height: 120px;
      overflow-y: auto;
      font-size: 11px;
    }
  </style>
</head>
<body>

  <h2>Executor de APK (Extração, Instalação e Acesso)</h2>

  <div class="upload-section">
    <input type="file" id="apkInput" accept=".apk">
  </div>

  <div id="phone-container">
    <canvas id="screen-canvas" width="360" height="640"></canvas>
  </div>

  <div id="terminal">> Aguardando arquivo .apk para instalação...</div>

<script>
  const canvas = document.getElementById('screen-canvas');
  const ctx = canvas.getContext('2d');
  const terminal = document.getElementById('terminal');
  const apkInput = document.getElementById('apkInput');

  function log(msg) {
    terminal.textContent += '\n> ' + msg;
    terminal.scrollTop = terminal.scrollHeight;
  }

  // Desenha a tela cinza inicial
  function desenharTelaCinza(statusText = 'Nenhum App Instalado', subText = '') {
    ctx.fillStyle = '#808080';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 15px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(statusText, canvas.width / 2, canvas.height / 2 - 10);

    if (subText) {
      ctx.font = '11px Monospace';
      ctx.fillStyle = '#e2e8f0';
      const textoCortado = subText.length > 35 ? '...' + subText.slice(-30) : subText;
      ctx.fillText(textoCortado, canvas.width / 2, canvas.height / 2 + 20);
    }
  }

  // Desenha a fase 1: Baixando / Extraindo arquivos
  function desenharProgressoDownload(progresso, arquivoAtual) {
    ctx.fillStyle = '#808080';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#1e293b';
    ctx.fillRect(30, 200, 300, 220);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 14px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('Extraindo pacotes do APK...', canvas.width / 2, 235);

    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.strokeRect(50, 270, 260, 18);

    ctx.fillStyle = '#38bdf8';
    ctx.fillRect(52, 272, (256 * progresso) / 100, 14);

    ctx.fillStyle = '#ffffff';
    ctx.font = '12px Arial';
    ctx.fillText(`${Math.round(progresso)}%`, canvas.width / 2, 310);

    ctx.font = '10px Monospace';
    ctx.fillStyle = '#94a3b8';
    const textoCortado = arquivoAtual.length > 30 ? '...' + arquivoAtual.slice(-25) : arquivoAtual;
    ctx.fillText(`Baixando: ${textoCortado}`, canvas.width / 2, 350);
  }

  // Desenha a fase 2: Instalando no sistema virtual
  function desenharTelaInstalando(progressoInstalacao) {
    ctx.fillStyle = '#808080';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#1e293b';
    ctx.fillRect(30, 200, 300, 220);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 14px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('Instalando aplicativo...', canvas.width / 2, 235);

    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.strokeRect(50, 270, 260, 18);

    ctx.fillStyle = '#22c55e';
    ctx.fillRect(52, 272, (256 * progressoInstalacao) / 100, 14);

    ctx.fillStyle = '#ffffff';
    ctx.font = '12px Arial';
    ctx.fillText(`${Math.round(progressoInstalacao)}%`, canvas.width / 2, 310);

    ctx.font = '11px Arial';
    ctx.fillStyle = '#94a3b8';
    ctx.fillText('Registrando bibliotecas e atalhos...', canvas.width / 2, 350);
  }

  // Desenha a fase 3: Aplicativo aberto e pronto para uso
  function entrarNoAplicativo(nomeApp) {
    log('Acessando interface do aplicativo...');

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Interface Principal do App
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Barra de status Android
    ctx.fillStyle = '#020617';
    ctx.fillRect(0, 0, canvas.width, 25);
    ctx.fillStyle = '#ffffff';
    ctx.font = '10px Arial';
    ctx.textAlign = 'left';
    ctx.fillText('12:00', 10, 16);
    ctx.textAlign = 'right';
    ctx.fillText('100%', canvas.width - 10, 16);

    // Barra de título do App
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0, 25, canvas.width, 50);
    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 14px Arial';
    ctx.textAlign = 'left';
    ctx.fillText(nomeApp.replace('.apk', ''), 15, 55);

    // Indicador visual de app rodando
    ctx.fillStyle = '#22c55e';
    ctx.beginPath();
    ctx.arc(canvas.width / 2, 180, 40, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 16px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('Aplicativo Aberto', canvas.width / 2, 250);

    ctx.font = '12px Arial';
    ctx.fillStyle = '#94a3b8';
    ctx.fillText('Instalação concluída com sucesso.', canvas.width / 2, 280);

    // Barra de navegação inferior
    ctx.fillStyle = '#020617';
    ctx.fillRect(0, canvas.height - 35, canvas.width, 35);
    ctx.fillStyle = '#94a3b8';
    ctx.font = '14px Arial';
    ctx.fillText('◄     ●     ■', canvas.width / 2, canvas.height - 12);
  }

  desenharTelaCinza();

  apkInput.addEventListener('change', async (event) => {
    const file = event.target.files[0];
    if (!file) return;

    terminal.textContent = '';
    log(`Iniciando leitura do arquivo: ${file.name}`);

    try {
      const zip = new JSZip();
      const zipContent = await zip.loadAsync(file);
      const files = Object.keys(zipContent.files);
      const totalFiles = files.length;

      if (totalFiles === 0) {
        log('ERRO: O arquivo .apk está vazio ou corrompido.');
        desenharTelaCinza('Erro na Instalação', 'Arquivo APK inválido');
        return;
      }

      log(`[FASE 1] Extraindo ${totalFiles} pacotes do arquivo...`);

      let processados = 0;

      // 1. EXTRAÇÃO / DOWNLOAD DOS PACOTES
      for (const nomeArquivo of files) {
        processados++;
        const progresso = (processados / totalFiles) * 100;

        desenharProgressoDownload(progresso, nomeArquivo);

        if (processados % 10 === 0 || processados === totalFiles) {
          log(`Extraindo: ${nomeArquivo}`);
          await new Promise(resolve => setTimeout(resolve, 1));
        }
      }

      log('[FASE 2] Pacotes baixados. Iniciando instalação no sistema...');

      // 2. INSTALAÇÃO DO APK
      for (let p = 1; p <= 100; p += 10) {
        desenharTelaInstalando(p);
        await new Promise(resolve => setTimeout(resolve, 50));
      }

      log('[FASE 3] Instalação finalizada! Abrindo o aplicativo...');
      
      // 3. ENTRADA NO APLICATIVO
      await new Promise(resolve => setTimeout(resolve, 200));
      entrarNoAplicativo(file.name);

    } catch (err) {
      log('ERRO no processo de extração/instalação: ' + err.message);
      desenharTelaCinza('Falha na Instalação', err.message);
    }
  });
</script>

</body>
</html>
